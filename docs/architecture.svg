<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Vault on EC2 architecture</title>
  <desc id="desc">Modern architecture diagram showing Route53, ACM, an Application Load Balancer, a Vault EC2 instance, and AWS KMS for auto-unseal.</desc>
  <style>
    svg { background: #ffffff; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
    .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #6b7280; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #374151; }
    .section { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #6b7280; }
    .label { font-size: 16px; font-weight: 700; }
    .body { font-size: 12px; fill: #374151; }
    .caption { font-size: 11px; fill: #4b5563; }
    .frame { fill: #f8fafc; stroke: #e5e7eb; stroke-width: 2; rx: 24; ry: 24; }
    .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 18; ry: 18; }
    .edge { fill: #eff6ff; stroke: #60a5fa; }
    .secure { fill: #f5f3ff; stroke: #a78bfa; }
    .accent { fill: #ecfeff; stroke: #22c55e; }
    .line { stroke: #60a5fa; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
    .line-muted { stroke: #a78bfa; stroke-width: 3; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow-purple); }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa" />
    </marker>
  </defs>

  <text x="48" y="40" class="kicker">Vault deployment</text>
  <text x="48" y="74" class="title">Vault on EC2 with a clean public edge and private backend</text>
  <text x="48" y="98" class="subtitle">Route53 and ACM handle public DNS and TLS. The ALB forwards requests to Vault on the instance private IP, and AWS KMS provides auto-unseal.</text>

  <rect x="48" y="136" width="864" height="300" class="frame" />
  <text x="72" y="166" class="section">AWS account</text>

  <rect x="84" y="214" width="184" height="96" class="card edge" />
  <text x="108" y="248" class="label">Route53</text>
  <text x="108" y="272" class="body">DNS alias record</text>
  <text x="108" y="292" class="body">vault_domain</text>

  <rect x="84" y="330" width="184" height="72" class="card edge" />
  <text x="108" y="360" class="label">ACM</text>
  <text x="108" y="382" class="body">TLS certificate for HTTPS</text>

  <rect x="324" y="190" width="256" height="190" class="card" />
  <text x="348" y="220" class="section">VPC</text>
  <text x="348" y="242" class="body">Two public subnets across AZs</text>
  <rect x="366" y="264" width="172" height="84" class="card edge" />
  <text x="452" y="296" text-anchor="middle" class="label">Application LB</text>
  <text x="452" y="318" text-anchor="middle" class="body">HTTPS :443 · TLS 1.3</text>

  <rect x="628" y="190" width="244" height="190" class="card secure" />
  <text x="652" y="220" class="section">EC2 instance</text>
  <text x="652" y="242" class="body">Approved RHEL 9 AMI</text>
  <rect x="668" y="264" width="164" height="84" class="card" />
  <text x="750" y="296" text-anchor="middle" class="label">Vault</text>
  <text x="750" y="318" text-anchor="middle" class="body">Private IP only · HTTP :8200</text>

  <rect x="628" y="392" width="244" height="72" class="card accent" />
  <text x="652" y="422" class="label">AWS KMS</text>
  <text x="652" y="444" class="body">Auto-unseal key with rotation</text>

  <path d="M 268 262 L 366 262" class="line" />
  <path d="M 268 366 L 324 366 L 324 306 L 366 306" class="line" />
  <path d="M 538 306 L 668 306" class="line" />
  <path d="M 750 392 L 750 348" class="line-muted" />

  <text x="280" y="248" class="caption">DNS lookup</text>
  <text x="280" y="382" class="caption">TLS certificate</text>
  <text x="548" y="292" class="caption">HTTPS in, HTTP to Vault</text>
  <text x="762" y="382" class="caption">seal &quot;awskms&quot;</text>

  <rect x="48" y="452" width="560" height="40" class="card" />
  <text x="72" y="477" class="body">Security posture: Vault is never public; only the ALB can reach the Vault listener on the instance private address.</text>
</svg>
