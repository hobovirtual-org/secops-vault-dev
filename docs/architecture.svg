<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Vault on EC2 architecture</title>
  <desc id="desc">Route53 and ACM front a public Application Load Balancer that sends traffic to a Vault EC2 instance in a dedicated VPC, with AWS KMS auto-unseal.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 600; }
    .small { font-size: 13px; fill: #57606a; }
    .box { fill: #f7f8fa; stroke: #d0d7de; stroke-width: 2; rx: 14; ry: 14; }
    .accent { fill: #eef5ff; stroke: #3b82d4; }
    .security { fill: #f5f3ff; stroke: #7c5cd8; }
    .line { stroke: #57606a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 8 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a" />
    </marker>
  </defs>

  <text x="40" y="42" class="title">Vault on EC2 with ALB, ACM, Route53, and KMS auto-unseal</text>

  <rect x="42" y="80" width="876" height="400" class="box" />
  <text x="62" y="110" class="label">AWS account</text>
  <text x="62" y="132" class="small">Dedicated VPC, public ALB, single Vault instance, private-IP listener</text>

  <rect x="92" y="176" width="170" height="84" class="box accent" />
  <text x="118" y="205" class="label">Route53</text>
  <text x="118" y="228" class="small">Alias A record</text>
  <text x="118" y="246" class="small">vault_domain</text>

  <rect x="92" y="310" width="170" height="84" class="box accent" />
  <text x="118" y="339" class="label">ACM</text>
  <text x="118" y="362" class="small">DNS-validated cert</text>
  <text x="118" y="380" class="small">TLS at ALB</text>

  <rect x="332" y="152" width="240" height="270" class="box" />
  <text x="356" y="183" class="label">VPC</text>
  <text x="356" y="205" class="small">Two public subnets across two AZs</text>

  <rect x="368" y="224" width="168" height="84" class="box accent" />
  <text x="391" y="253" class="label">Application LB</text>
  <text x="391" y="276" class="small">HTTPS :443</text>
  <text x="391" y="294" class="small">TLS 1.3 policy</text>

  <rect x="620" y="152" width="240" height="270" class="box security" />
  <text x="644" y="183" class="label">Vault EC2 instance</text>
  <text x="644" y="205" class="small">RHEL 9 approved AMI</text>

  <rect x="654" y="232" width="172" height="90" class="box" />
  <text x="688" y="261" class="label">Vault</text>
  <text x="688" y="284" class="small">Binds to private IP</text>
  <text x="688" y="302" class="small">HTTP :8200 from ALB only</text>

  <rect x="654" y="338" width="172" height="56" class="box" />
  <text x="680" y="371" class="small">Encrypted gp3 root volume</text>

  <rect x="620" y="446" width="240" height="60" class="box accent" />
  <text x="646" y="474" class="label">AWS KMS</text>
  <text x="646" y="494" class="small">Auto-unseal key with rotation enabled</text>

  <path d="M 262 218 L 332 218" class="line" />
  <path d="M 262 352 L 332 352 L 332 286 L 368 286" class="line dashed" />
  <path d="M 536 266 L 654 266" class="line" />
  <path d="M 740 446 L 740 394" class="line dashed" />

  <text x="278" y="204" class="small">DNS</text>
  <text x="270" y="338" class="small">Certificate validation</text>
  <text x="552" y="252" class="small">HTTPS to ALB, HTTP in VPC</text>
  <text x="752" y="426" class="small">seal &quot;awskms&quot;</text>

  <text x="42" y="522" class="small">Generated for this repository README. No external assets required.</text>
</svg>
