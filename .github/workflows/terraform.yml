name: Terraform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_INPUT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        env:
          TF_VAR_allowed_cidr_blocks: '["0.0.0.0/0"]'
          TF_VAR_ami_owner_account_id: "123456789012"
          TF_VAR_existing_key_pair_name: "ci-key"
          TF_VAR_project_name: "ci"
          TF_VAR_route53_zone_name: "example.com"
          TF_VAR_vault_domain: "vault.example.com"
        run: terraform validate
